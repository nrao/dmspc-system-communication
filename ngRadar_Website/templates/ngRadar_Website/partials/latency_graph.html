<div class="Live_Latency_Graph" style="display:flex; justify-content:center; align-items:center;">
    <title>Live Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <canvas id="LatencyChart" width="1000" height="500"></canvas>
    <style>
        #LatencyChart {
            background: #ffffff;
            padding-left: 25px;
            padding-right: 25px;
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>
    <script>
        const ctx = document.getElementById('LatencyChart').getContext('2d');
        let eventMetadata = [];

        const Latency_Chart = new Chart(ctx, {
            type: 'line',

            data: {
                labels: [],
                datasets: [{
                    label: 'Message Latency',
                    data: [],
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 2,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)'
                }]
            },

            options: {
                responsive: false,

                plugins: {
                    legend: {
                        labels: {
                            font: { size: 16 },
                            color: '#000'
                        }
                    },

                    tooltip: {
                        callbacks: {

                            title: function(context) {
                                const index = context[0].dataIndex;
                                const meta = eventMetadata[index];

                                if (!meta) {
                                    return context[0].label;
                                }

                                return meta.station;
                            },

                            label: function(context) {
                                const index = context.dataIndex;
                                const meta = eventMetadata[index];

                                if (!meta) {
                                    return `Latency: ${context.parsed.y} ms`;
                                }

                                return [
                                    `Status: ${meta.status}`,
                                    `Latency: ${context.parsed.y} ms`,
                                    `Time: ${meta.time}`,
                                    `Object ID: ${meta.object_id}`,
                                    `Target: ${meta.target}`
                                ];
                            }
                        }
                    }
                },

                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Event Source',
                            font: { size: 14 },
                            color: '#000'
                        },

                        ticks: {
                            font: { size: 13 }
                        }
                    },

                    y: {
                        beginAtZero: true,

                        title: {
                            display: true,
                            text: 'Latency (ms)',
                            font: { size: 14 },
                            color: '#000'
                        },

                        ticks: {
                            font: { size: 13 }
                        }
                    }
                }
            }
        });

        const source = new EventSource("{% url 'latency_graphing' %}");

        source.onmessage = function(event) {
            const data = JSON.parse(event.data);

            eventMetadata = data.event_metadata_array;

            Latency_Chart.data.labels = data.event_source_array;
            Latency_Chart.data.datasets[0].data = data.latency_array;

            Latency_Chart.update();
        };
