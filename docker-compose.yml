  gbt:
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - .:/service
      # - ngrok_env:/out
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: kafka-broker:29092
    entrypoint:
        - python
        - manage.py
        - gbt_sim
