# ===========================================================================
# We use 1 Dockerfile and 1 docker-compose.yml file to build and 
# run the Django application in a containerized environment.
# If hosted locallly, it uses local .env and a local Postgres database. 
# For live demo, it uses demo .env and the Render-hosted Postgres database.
# ===========================================================================


#==========================
# UI + DB containers:
#==========================

services:
  ngradar_website:
    build:
      context: .
      target: app
    env_file:
      - .env
    depends_on:
      postgres:
          condition: service_healthy
    volumes:
      - .:/service
    ports:
      - 8000:8000
    networks:
      - ngradar_website_network
    stdin_open: true
    tty: true

  postgres:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=ngradar_website
      - POSTGRES_PASSWORD=ngradar_website
      - POSTGRES_DB=localdev
    networks:
      - ngradar_website_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngradar_website -d localdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  staging_loader:
    build:
      context: .
      target: load-staging-data
    env_file:
      - .env
    networks:
      - ngradar_website_network
    depends_on:
      - postgres
    volumes:
      - staging_dump:/dump
    profiles:
      - tools

#==========================
# kafka related containers:
#==========================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ngradar_website_network



# A one-shot init service that creates the Kafka topics after the broker is healthy
  kafka-init:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      kafka-broker:
        condition: service_healthy
    profiles: ["kafka"]
    networks:
      - ngradar_website_network
    entrypoint:
    - /bin/sh
    - -ec
    - |
      echo "Creating Kafka topics..."

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic user_input \
        --partitions 3 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic GBT_data \
        --partitions 1 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic VLBA_notif \
        --partitions 1 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic DSOC_notif \
        --partitions 1 \
        --replication-factor 1

      echo "Kafka topic initialization complete."
    restart: "no"


  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["kafka"]
    env_file:
      - .env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      kafka-broker:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    command:
      - start
      - --all
      - --config
      - /etc/ngrok.yml
    networks:
      - ngradar_website_network
    

  kafka-broker:
    user: "0:0"
    image: confluentinc/cp-kafka:7.5.1
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://${NGROK_KAFKA_TCP_ADDRESS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - ngradar_website_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka-broker:29092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["kafka"]
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
    depends_on:
      - kafka-broker
    networks:
      - ngradar_website_network




#==========================
# sim containers:
#==========================

  gbt:
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - .:/service
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: kafka-broker:29092
      # if we move this sim to a separate machine, use the below bootstrap server:
      # BOOTSTRAP_SERVER=7.tcp.ngrok.io:26729
    entrypoint:
        - python
        - manage.py
        - gbt_sim



  dsoc:
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    volumes:
      - .:/service
      - dsoc_transfer:/dsoc/incoming
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: kafka-broker:29092
      # if we move this sim to a separate machine, use the below bootstrap server:
      # BOOTSTRAP_SERVER=7.tcp.ngrok.io:26729
    entrypoint:
        - python
        - manage.py
        - dsoc_sim
  

  

  vlba:
    build:
      context: .
      target: etc
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      etr_daemon:
        condition: service_started
    volumes:
      - .:/service
      - vlba_data:/raw_data
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      ETD_DESTINATION: "etr_daemon:/dsoc/incoming/"
      BOOTSTRAP_SERVER: kafka-broker:29092
      # if we move this sim to a separate machine, use the below bootstrap server:
      # BOOTSTRAP_SERVER=7.tcp.ngrok.io:26729
    entrypoint:
      - python
      - manage.py
      - vlba_sim



#==========================
# storage containers:
#==========================
  seaweedfs:
    build: 
      context: .
      target: seaweedfs
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEED_S3_ACCESS_KEY: ${WEED_S3_ACCESS_KEY}
      WEED_S3_SECRET_KEY: ${WEED_S3_SECRET_KEY}
    ports:
      - "8333:8333" # SeaweedFS S3 gateway (ngrok exposes this during demos for our cloud-hosted website to retrieve images)
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweed_data:/data
    depends_on:
      - postgres
    networks:
      - ngradar_website_network
    profiles: ["kafka"]



  storage-ui:
    image: mastertinner/s3manager:latest
    platform: linux/amd64
    ports:
      - "${GUI_PORT:-3000}:8080" 
    environment:
      - ACCESS_KEY_ID=${WEED_S3_ACCESS_KEY:-anykey}
      - SECRET_ACCESS_KEY=${WEED_S3_SECRET_KEY:-anysecret}
      - ENDPOINT=seaweedfs:8333 
      - USE_SSL=false
    networks:
      - ngradar_website_network


#==========================
# etransfer containers:
#==========================
# a one-shot init service that creates the volume before etd starts
  dsoc-volume-init:
    image: alpine:3.20
    profiles: ["kafka"]
    user: "0:0"
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /dsoc/incoming
        chown -R 33:33 /dsoc/incoming
        chmod 775 /dsoc/incoming

  etr_daemon:
    build:
      context: .
      target: etd
    profiles: ["kafka"]
    user: "33:33"   # non root user: www-data
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
    networks:
      - ngradar_website_network
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - etd
      - -f
      - --command
      - tcp://:4004
      - --data
      - srt://:8008



#==========================
# end of containers
#==========================


volumes:
  postgres_data:
  staging_dump:
  seaweed_data:
  dsoc_transfer:
  vlba_data:

networks:
  ngradar_website_network:
    driver: bridge