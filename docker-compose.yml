# ===========================================================================
# We use 1 Dockerfile and 1 docker-compose.yml file to build and 
# run the Django application in a containerized environment.
# Currently only configured to work across droplets. Will not work correctly fully local.
# ===========================================================================


#==========================
# Website + routing + DB
# container health related
# serviced:
#==========================

services:

  portainer: # only run on dsoc droplet
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # - "9000:9000"
      # - "9443:9443"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


  portainer_agent: # only run on remote machines: gbt and vlba
    image: portainer/agent:latest
    container_name: portainer_agent
    security_opt:
      - no-new-privileges:true
    # environment:
    #   # Optional: Restrict agent access to your Portainer Server IP for security
    #   - AGENT_SECRET=your_optional_secret_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    restart: always


# DSOC droplet only traefik container
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
     # Connect to the 'traefik_proxy' overlay network for inter-container communication across nodes
      # - proxy
      proxy:
        aliases:
          - traefik-metrics # using an alias here so prometheus won't care if local or droplet traefik container is running

    ports:
      - "80:80" # website HTTP
      - "443:443" # website HTTPS
      - "127.0.0.1:8080:8080" # Dashboard
      - "5432:5432" # postgres
      - "9092:9092" # kafka broker
      - "4004:4004" # etransfer command port
      - "8008:8008/udp" # etransfer data port

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.postgres.address=:5432"
      - "--entrypoints.kafka.address=:9092"
      - "--entrypoints.etransfer-command.address=:4004"
      - "--entrypoints.etransfer-data.address=:8008/udp"

      # Dedicated Prometheus metrics endpoint
      - "--entrypoints.metrics.address=:8082"

      # Optional redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure" 
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # Docker providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # Let's Encrypt / ACME
      # - "--certificatesresolvers.le.acme.email=${COHORT_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json" 
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      
      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"

      # Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"

  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"

# Local dev traefik container
  traefik_http:
    image: traefik:v3.7
    container_name: traefik_http
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      # Local bridge network used by Traefik to reach
      # the Django container on the DSOC Droplet.
      # - proxy
      proxy:
        aliases:
          - traefik-metrics # using an alias here so prometheus won't care if local or droplet traefik container is running

    ports:
      - "80:80" # website HTTP
      - "127.0.0.1:8080:8080" # dashboard
      - "5432:5432" # postgres
      # - "9092:9092" # kafka broker
      - "4004:4004" # etransfer command port
      - "8008:8008/udp" # etransfer data port

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.postgres.address=:5432"
      # - "--entrypoints.kafka-1.address=:9092"
      - "--entrypoints.etransfer-command.address=:4004"
      - "--entrypoints.etransfer-data.address=:8008/udp"

      # Dedicated Prometheus metrics endpoint
      - "--entrypoints.metrics.address=:8082"

      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"

      # Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"

  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"



  ngradar_website:
    container_name: ngradar_website
    build:
      context: .
      target: app
    env_file:
      - .env
    depends_on:
      postgres:
          condition: service_healthy
    volumes:
      - .:/service
    # ports:
    #   - 8000:8000
    networks:
      ngradar_website_network:
        aliases:
          - ngradar-website-network # Prometheus does not like the target with an underscore so we need this network alias
      proxy:
    environment:
      # this is what tells the ngradar_website service to run the UI Kafka consumer in a separate thread, which is what we want for the SSE functionality.
      ENABLE_UI_KAFKA_CONSUMER: "true"
      UI_KAFKA_TOPICS: "GBT_notif,VLBA_notif,DSOC_notif,progress_tracking"
      UI_KAFKA_GROUP_ID: "ngradar-ui-sse"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Tells Traefik to route public requests matching your domain/IP to this container
      - "traefik.http.routers.ngradar_website.rule=Host(`${WEBSITE_DOMAIN_NAME}`)"
      - "traefik.http.routers.ngradar_website.entrypoints=${HTTP_ENTRYPOINT:-web}" 
      - "traefik.http.routers.ngradar_website.service=ngradar_website"
      - "traefik.http.routers.ngradar_website.tls=${TLS:-false}" #false when local, true on droplet
      - "${CERTRESOLVER}" # reads dummy label when local, and certificate resolver when deployed on droplets with HTTPS

      # Optional: Explicitly tell Traefik which port your web app container listens on internally
      - "traefik.http.services.ngradar_website.loadbalancer.server.port=8000"
    stdin_open: true
    tty: true
    command: >
      uvicorn asgi:application
      --host 0.0.0.0
      --port 8000


  postgres:
    container_name: postgres
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    # ports:
    #   # - ${WEBSITE_DOMAIN}:5432:5432
    #   - "${PUBLIC_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - ngradar_website_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.postgres.entrypoints=postgres"
      - "traefik.tcp.routers.postgres.service=postgres"

      # PostgreSQL's internal container port
      - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5



#==========================
# kafka containers:
#==========================

# A one-shot init service that creates the Kafka topics after the broker is healthy
  kafka-init:
    container_name: kafka-init
    image: confluentinc/cp-kafka:7.5.1
    # depends_on:
    #   kafka-node-1:
    #     condition: service_healthy
    profiles: ["kafka"]
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - ngradar_website_network
    entrypoint:
    - /bin/sh
    - -ec
    - |
      echo "Waiting for Kafka..."

      until kafka-topics \
          --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
          --list >/dev/null 2>&1
      do
          echo "Kafka not ready yet..."
          sleep 2
      done
      
      echo "Kafka is ready."
      echo "Creating Kafka topics..."

      kafka-topics --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
        --create --if-not-exists \
        --topic GBT_notif \
        --partitions 3 \
        --replication-factor 3 \
        --config min.insync.replicas=2

      kafka-topics --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
        --create --if-not-exists \
        --topic VLBA_notif \
        --partitions 3 \
        --replication-factor 3 \
        --config min.insync.replicas=2

      kafka-topics --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
        --create --if-not-exists \
        --topic DSOC_notif \
        --partitions 3 \
        --replication-factor 3 \
        --config min.insync.replicas=2

      kafka-topics --bootstrap-server "$KAFKA_BOOTSTRAP_SERVERS" \
        --create --if-not-exists \
        --topic progress_tracking \
        --partitions 3 \
        --replication-factor 3 \
        --config min.insync.replicas=2

      echo "Kafka topic initialization complete."
    restart: "no"



  kafka-node-1:
    container_name: kafka-node-1
    hostname: ${KAFKA_EXTERNAL_HOST:-kafka-node-1} # default localhost?
    user: "0:0"
    image: apache/kafka:4.1.2
    profiles: ["kafka"]
    # depends_on:
    #   - zookeeper
    ports:
      - "9091:9091"
      - "19092:19092"
      - "19093:19093"
    volumes:
      - ./jmx-exporter:/opt/jmx-exporter:ro
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: BROKER://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: BROKER://${KAFKA_EXTERNAL_HOST:-kafka-node-1}:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9091

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUOROM_VOTERS:-1@kafka-node-1:19093,2@kafka-node-2:29093,3@kafka-node-3:39093}

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_OPTS: >-
        -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-1.6.0.jar=7071:/opt/jmx-exporter/kafka.yml
    networks:
