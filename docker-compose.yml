#==========================
# consumer sim containers:
#==========================

  gbt:
    container_name: gbt
    build:
      context: .
      target: base
    env_file:
      - .env
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   kafka-broker:
    #     condition: service_healthy
    #   kafka-init:
    #     condition: service_completed_successfully
    volumes:
      - .:/service
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS} # needs all 3 brokers
      OTEL_SERVICE_NAME: "gbt"
    entrypoint:
        - python
        - manage.py
        - gbt_sim


  dsoc:
    container_name: dsoc
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # kafka-node-1:
      #   condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    volumes:
      - .:/service
      - dsoc_transfer:/dsoc/incoming 
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS} #needs all 3 brokers
      DSOC_VOLUME_SIZE: ${DSOC_VOLUME_SIZE}
      OTEL_SERVICE_NAME: "dsoc"
    entrypoint:
        - python
        - manage.py
        - dsoc_sim
  

  progress_tracker:
    container_name: progress_tracker
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      dsoc:
        condition: service_started
    volumes:
      - .:/service
      - dsoc_transfer:/dsoc/incoming
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      # BOOTSTRAP_SERVER: kafka-broker:29092
      BOOTSTRAP_SERVER: ${BOOTSTRAP_SERVER:-kafka-broker:29092}
      OTEL_SERVICE_NAME: "progress_tracker"
    entrypoint:
        - python
        - manage.py
        - progress_tracker


  vlba:
    container_name: vlba
    build:
      context: .
      target: etc
    env_file:
      - .env
    volumes:
      - .:/service
      - vlba_data:/raw_data
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVERS} # needs all 3 brokers bootstrap server
      ETD_HOST: ${ETD_HOST}
      ETD_COMMAND_PORT: ${ETD_COMMAND_PORT:-4004}
    entrypoint:
      - python
      - manage.py
      - vlba_sim
  

  vlba-sc:
    extends:
      service: vlba
    container_name: vlba-SC
    environment:
      STATION_NAME: SC
      OTEL_SERVICE_NAME: "vlba-sc"


  vlba-hn:
    extends:
      service: vlba
    container_name: vlba-HN
    environment:
      STATION_NAME: HN
      OTEL_SERVICE_NAME: "vlba-hn"
  

  vlba-nl:
    extends:
      service: vlba
    container_name: vlba-NL
    environment:
      STATION_NAME: NL
      OTEL_SERVICE_NAME: "vlba-nl"

  vlba-fd:
    extends:
      service: vlba
    container_name: vlba-FD
    environment:
      STATION_NAME: FD
      OTEL_SERVICE_NAME: "vlba-fd"

  vlba-la:
    extends:
      service: vlba
