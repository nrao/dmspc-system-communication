# a one-shot init service that creates the 3 kafka topics before the broker starts
  kafka-init:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      kafka-broker:
        condition: service_healthy
    profiles: ["kafka"]
    networks:
      - ngradar_website_network
    entrypoint:
    - /bin/sh
    - -ec
    - |
      echo "Creating Kafka topics..."

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic user_input \
        --partitions 3 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic GBT_data \
        --partitions 1 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic VLBA_data \
        --partitions 1 \
        --replication-factor 1

      echo "Kafka topic initialization complete."
    restart: "no"
    

  kafka-broker:
    user: "0:0"
    image: confluentinc/cp-kafka:7.5.1
    profiles: ["kafka"]
    depends_on:
      - zookeeper
      # - ngrok
    # volumes:
    #   - ngrok_env:/out
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Required for a one-broker development cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    # environment:
    #   KAFKA_BROKER_ID: 1
    #   KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    #   KAFKA_LISTENERS: DOCKER://broker:29092, NGROK://broker:9092
