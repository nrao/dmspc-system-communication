#==========================
# etransfer containers:
#==========================
# a one-shot init service that creates the volume before etd starts
  dsoc-volume-init:
    container_name: dsoc-volume-init
    image: alpine:3.20
    profiles: ["kafka"]
    user: "0:0"
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /dsoc/incoming
        chown -R 33:33 /dsoc/incoming
        chmod 775 /dsoc/incoming

  etr_daemon:
    container_name: etr_daemon
    build:
      context: .
      target: etd
    profiles: ["kafka"]
    user: "33:33"   # non root user: www-data
    # ports:
    #   - "${PUBLIC_BIND_IP:-127.0.0.1}:4004:4004/tcp"
    #   - "${PUBLIC_BIND_IP:-127.0.0.1}:8008:8008/udp"
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
    networks:
      - ngradar_website_network
      - proxy
    volumes:
      - dsoc_transfer:/dsoc/incoming
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # TCP traffic on port 4004
      - "traefik.tcp.routers.etransfer-command.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.etransfer-command.entrypoints=etransfer-command"
      - "traefik.tcp.routers.etransfer-command.service=etransfer-command"
      - "traefik.tcp.services.etransfer-command.loadbalancer.server.port=4004"

      # UDP/SRT traffic on port 8008
      - "traefik.udp.routers.etransfer-data.entrypoints=etransfer-data"
      - "traefik.udp.routers.etransfer-data.service=etransfer-data"
      - "traefik.udp.services.etransfer-data.loadbalancer.server.port=8008"
    command:
      - etd
      - -f
      - --command
      - tcp://:4004
      - --data
      - srt://:8008


#===============================
# metrics + logging containers
#===============================

  prometheus:
    image: prom/prometheus:latest # I feel like we should pin a specific version? Rather than the latest?
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - proxy
      - ngradar_website_network # Giving prometheus access to both networks for metrics monitoring

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:nightly
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./otel-collector/otelcol-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - ngradar_website_network
    depends_on:
      - tempo
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  tempo:
    image: grafana/tempo:main-ff11875-2195-1
    container_name: tempo
    volumes:
      - ./otel-collector/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - ngradar_website_network
    command: ["-config.file=/etc/tempo.yaml"]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - proxy
      - ngradar_website_network
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus


  k6:
    image: grafana/k6:0.54.0
    container_name: k6
    profiles:
      - loadtest
    networks:
      - ngradar_website_network
    volumes:
      - ./k6:/scripts:ro
      - ./k6-results:/results
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max
      # K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      K6_BASE_URL: ${K6_BASE_URL:-http://ngradar-website-network:8000}
      K6_USERNAME: ${K6_USERNAME}
      K6_PASSWORD: ${K6_PASSWORD}
      K6_IMAGE_ID: ${K6_IMAGE_ID} # give .env an image id that is in YOUR database
    entrypoint: ["k6"]
    depends_on:
      - prometheus
      - ngradar_website


  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest # we should have a pinned version eventually, I feel
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}
    networks:
      - ngradar_website_network
    depends_on:
      postgres:
        condition: service_healthy

  kafka-exporter: # Do we still need this if we're scraping kafka JMX now??
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    profiles: ["kafka"]
    command:
      - "--kafka.server=kafka-node-1:19092"
      - "--topic.exclude=^__.*"
      - "--refresh.metadata=15s"
    # depends_on:
    #   kafka-node-1:
    #     condition: service_healthy
    networks:
      - ngradar_website_network


#==========================
# end of containers
#==========================


volumes:
  postgres_data:
  seaweed_data:
  dsoc_transfer:
  vlba_data:
  portainer_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  ngradar_website_network:
    driver: bridge
  proxy:
    name: proxy
    driver: bridge