# Consumes kafka messages and writes them to the database.
# This is a separate service from the UI consumer, which is only for sending messages to the front-end via SSE.
# The UI consumer is part of the ngradar_website service, while this db_consumer is a separate service
# that runs in the background and writes to the database.
  db_consumer:
    container_name: db_consumer
    build:
      context: .
      target: app
    env_file:
      - .env
    profiles:
      - kafka
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ngradar_website_network
    restart: unless-stopped
    environment:
      DB_KAFKA_TOPICS: "GBT_notif,VLBA_notif,DSOC_notif"
      DB_KAFKA_GROUP_ID: "ngradar-db"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      OTEL_SERVICE_NAME: "db_consumer"
    command: >
      python manage.py db_consumer

#==========================
# storage containers:
#==========================
  seaweedfs:
    container_name: seaweedfs
    build: 
      context: .
      target: seaweedfs
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEED_S3_ACCESS_KEY: ${WEED_S3_ACCESS_KEY}
      WEED_S3_SECRET_KEY: ${WEED_S3_SECRET_KEY}
    # ports:
    #   - "8333:8333" # SeaweedFS S3 gateway (ngrok exposes this during demos for our cloud-hosted website to retrieve images)
    #   - "8888:8888"
    #   - "9333:9333"
    volumes:
      - seaweed_data:/data
    depends_on:
      - postgres
    networks:
      - ngradar_website_network
      - proxy 
    profiles: ["kafka"]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # S3 traffic on port 8333
      - "traefik.http.routers.seaweedfs.rule=Host(`images.${WEBSITE_DOMAIN_NAME}`)"
      - "traefik.http.routers.seaweedfs.entrypoints=${HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.seaweedfs.service=seaweedfs"
      - "traefik.http.routers.seaweedfs.tls=${TLS:-false}" #false when local, true on droplet
      - "${SEAWEEDFS_CERTRESOLVER}" # reads dummy label when local, and certificate resolver when deployed on droplets with HTTPS
      - "traefik.http.services.seaweedfs.loadbalancer.server.port=8333"



