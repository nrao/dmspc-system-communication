#==========================
# storage containers:
#==========================
  seaweedfs:
    build: 
      context: .
      target: seaweedfs
      # dockerfile: seaweed.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEED_S3_ACCESS_KEY: ${WEED_S3_ACCESS_KEY}
      WEED_S3_SECRET_KEY: ${WEED_S3_SECRET_KEY}
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweed_data:/data
    depends_on:
      - postgres
    networks:
      - ngradar_website_network
    profiles: ["kafka"]



  storage-ui:
    image: mastertinner/s3manager:latest
    platform: linux/amd64
    ports:
      - "${GUI_PORT:-3000}:8080" 
    environment:
      - ACCESS_KEY_ID=${WEED_S3_ACCESS_KEY:-anykey}
      - SECRET_ACCESS_KEY=${WEED_S3_SECRET_KEY:-anysecret}
      - ENDPOINT=seaweedfs:8333 
      - USE_SSL=false
    networks:
      - ngradar_website_network


#==========================
# etransfer containers:
#==========================
# a one-shot init service that creates the volume before etd starts
  dsoc-volume-init:
    image: alpine:3.20
    profiles: ["kafka"]
    user: "0:0"
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /dsoc/incoming
        chown -R 33:33 /dsoc/incoming
        chmod 775 /dsoc/incoming

  etr_daemon:
    build:
      context: .
      target: etd
    profiles: ["kafka"]
    user: "33:33"   # non root user: www-data
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
    networks:
      - ngradar_website_network
    volumes:
      - dsoc_transfer:/dsoc/incoming
    command:
      - etd
      - -f
      - --command
      - tcp://:4004
      - --data
      - srt://:8008

progress_writer:


#==========================
# end of containers
#==========================


volumes:
  postgres_data:
  staging_dump:
  seaweed_data:
  # ngrok_env:
  dsoc_transfer:
  vlba_data:

networks:
  ngradar_website_network:
    driver: bridge