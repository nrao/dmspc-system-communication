# ===========================================================================
# We use 1 Dockerfile and 1 docker-compose.yml file to build and 
# run the Django application in a containerized environment.
# If hosted locallly, it uses the local Postgres database. If in production, 
# it uses the Render-hosted Postgres database.
# ===========================================================================


#==========================
# UI + DB containers:
#==========================

services:
  ngradar_website:
    build:
      context: .
      target: app
    env_file:
      - .env
    depends_on:
      postgres:
          condition: service_healthy
    volumes:
      - .:/service
      # - ngrok_env:/out
    ports:
      - 8000:8000
    networks:
      - ngradar_website_network
    stdin_open: true
    tty: true

  postgres:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=ngradar_website
      - POSTGRES_PASSWORD=ngradar_website
      - POSTGRES_DB=localdev
    networks:
      - ngradar_website_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngradar_website -d localdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  staging_loader:
    build:
      context: .
      target: load-staging-data
      # dockerfile: load-staging-data.Dockerfile
    env_file:
      - .env
    networks:
      - ngradar_website_network
    depends_on:
      - postgres
    volumes:
      - staging_dump:/dump
    profiles:
      - tools

