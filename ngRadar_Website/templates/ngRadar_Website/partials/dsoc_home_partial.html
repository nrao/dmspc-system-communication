<!-- Image and Image status message: -->

<div class="mt-4 border rounded pt-3 pb-3 bg-white ps-3 pe-3 text-center mx-auto"
style="max-width: 50rem;">
        {% if latest_etr_event.status == 8 and latest_image_event %}
            <h5 class="fw-bold">
                DDM last updated at
                {{ latest_image_event.event_time|date:"F d Y H:i:s" }}
            </h5>
            <img
                id="new-ddm-image"
                src="{% url 'serve_image' latest_image_event.uuid %}"
                alt="DDM generated by DSOC"
                class="img-fluid d-block mx-auto"
                style="display:none;"
            >
            <div id="image-loading" class="text-muted p-5">
                Loading latest image...
            </div>
        {% else %}
            <h5 class="fw-bold">Waiting for DDM to be created...</h5>
            <p class="text-muted mt-5">No image available yet</p>
        {% endif %}
</div>


<!-- This js is to allow cross-origin requests (CORS) to seaweedfs -->
<script src="../../../static/ngRadar_Website/js/dsoc_home_seaweed_script.js"></script>
