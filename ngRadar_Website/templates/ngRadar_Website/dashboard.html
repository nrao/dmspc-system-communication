{% extends 'ngRadar_Website/base.html' %}
{% load static %}

{% block title %}System Communication Demo{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'ngRadar_Website/css/global.css' %}">
<link rel="stylesheet" href="{% static 'ngRadar_Website/css/styleguide.css' %}">
<link rel="stylesheet" href="{% static 'ngRadar_Website/css/style.css' %}">

<!-- HTMX Engine Injection -->
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>

<div class="dashboard-wrapper d-flex flex-column min-vh-100" data-color-mode="SDS-light">
    
   <header class="p-3 border-bottom d-flex align-items-center gap-3">
    <img class="logogroupcolor" 
         src="{% static 'ngRadar_Website/images/logo.png' %}" 
         alt="NSF, Associated Universities, Inc., and National Radio Astronomy Observatory logos"
         style="height: 50px; width: auto; object-fit: contain;" />
         
    <h1 class="text-wrapper-5 mb-0 fs-3">System Communication Demo</h1>
    </header>
    
    <main class="flex-grow-1 container-fluid px-4 my-4">
        
        <!-- REAL-TIME LIVESTREAM DASHBOARD TARGET ZONE -->
        <!-- Polls the Django views every 3 seconds to inject raw database metrics below the header -->
        <div id="dashboard-content" 
             hx-get="{% url 'event_table_update' %}" 
             hx-trigger="every 3s" 
             hx-target="#dashboard-content"
             class="w-100">
            {% include 'ngRadar_Website/partials/dashboard_updates.html' %}
        </div>
    </main>

    <body>
    <title>Live Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <canvas id="LatencyChart"></canvas>
        <script>
            const ctx = document.getElementById('LatencyChart').getContext('2d');
            const myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [], // Time labels
                    datasets: [{
                        label: 'Message Latency',
                        data: [], // Data points
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            const source = new EventSource("{% url 'latency_graphing' %}");
            source.onmessage = function(event) {
                const data = JSON.parse(event.data);
                myChart.data.labels.push(data.time_sent);
                myChart.data.datasets[0].data.push(data.latency);
                myChart.update();
            };
        </script>
    </body>

    <footer class="mt-auto py-3 text-center border-top bg-light">
        <p class="text-wrapper-7 mb-0">Developed by Cohort 1</p>
    </footer>

</div>
{% endblock %}
